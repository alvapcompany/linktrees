name: Scraper de Reseñas de Google Maps

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente con 1 clic desde GitHub cuando tú quieras

permissions:
  contents: write

jobs:
  scrape-google-maps:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependencias (Puppeteer & Chromium)
        run: |
          npm install puppeteer

      - name: 🚀 Ejecutar Scraper de Google Maps
        run: |
          node scripts/scrape-reviews.js

      - name: 💾 Guardar y hacer Commit de las nuevas reseñas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/businesses.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(reviews): auto-update google maps reviews [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
            echo "✅ Nuevas reseñas commiteadas y subidas a main."
          else
            echo "ℹ️ No hay cambios en las reseñas."
          fi
