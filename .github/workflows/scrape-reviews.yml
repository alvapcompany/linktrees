name: Scraper de Reseñas de Google Maps

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/businesses.json'
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  scrape-google-maps:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar dependencias (Puppeteer & Chromium)
        run: |
          npm install puppeteer --no-save --no-package-lock

      - name: 🚀 Ejecutar Scraper de Google Maps
        run: |
          node scripts/scrape-reviews.js

      - name: 💾 Guardar y hacer Commit de las nuevas reseñas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git checkout -- package*.json 2>/dev/null || true
          git add data/businesses.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(reviews): auto-update google maps reviews [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
            echo "✅ Nuevas reseñas commiteadas y subidas a main."
          else
            echo "ℹ️ No hay cambios en las reseñas."
          fi
